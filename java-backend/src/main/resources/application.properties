spring.application.name=switcher-backend
server.port=2000

# llm-cascade Sidecar (im selben Docker-Compose-Netz).
llm.cascade.url=${LLM_CASCADE_URL:http://llm-cascade:8090}

# ~/.claude-Pfade fuer ccr-Config + Switcher-Settings. Container hat Host-~/.claude
# als Volume gemounted unter /root/.claude — Pfade liegen darunter.
switcher.claude.config=${CLAUDE_CONFIG_PATH:/root/.claude/settings.json}
switcher.router.config=${ROUTER_CONFIG_PATH:/root/.claude/router-config.json}
switcher.router.container=${ROUTER_CONTAINER:claude-switcher-router-1}
switcher.router.url=${ROUTER_BASE_URL:http://router:3457}

# Postgres: aktiviert ab Phase K (2026-05-14) — eigener Modell-Context fuer
# Symmetrie zu EduPro. Tabellen: ai_model_config (Cascade-Liste), app_settings
# (API-Keys + Cooldown-Override). ~/.claude/settings.json bleibt fuer CLI-
# Operativ-Daten (activeRoute, chain_position).
# DB-Connection wird per Standard-Spring-Vars vom docker-compose.yml ueberschrieben
# (SPRING_DATASOURCE_URL/USERNAME/PASSWORD). Defaults hier passen zum Compose-Setup
# (User/PW/DB-Name jeweils "switcher").
spring.datasource.url=jdbc:postgresql://db:5432/switcher
spring.datasource.username=switcher
spring.datasource.password=switcher
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
