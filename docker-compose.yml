services:
  claude-switcher:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ${HOME:-${USERPROFILE}}/.claude:/root/.claude
      # Docker-Socket: damit der Switcher den Router-Container bei Key-Änderungen neu starten kann
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CLAUDE_CONFIG_PATH=/root/.claude/settings.json
      - ROUTER_CONFIG_PATH=/root/.claude/router-config.json
      - ROUTER_CONTAINER=claude-switcher-router-1
      - ROUTER_BASE_URL=http://router:3456
    restart: unless-stopped
    depends_on:
      - router

  router:
    build: ./router
    container_name: claude-switcher-router-1
    ports:
      - "3456:3456"
    volumes:
      # Router liest seine Config aus dem geteilten ${HOME:-${USERPROFILE}}/.claude/-Volume.
      # Switcher schreibt sie bei jedem Provider/Key-Change und restartet den Router.
      - ${HOME:-${USERPROFILE}}/.claude:/host-claude:ro
    environment:
      - NON_INTERACTIVE_MODE=true
      - LOG_LEVEL=info
    restart: unless-stopped
    # Beim Start: Config aus geteiltem Volume nach erwartetem Pfad kopieren, dann ccr starten
    # `ccr start` daemonisiert sich → wir halten den Container danach via `wait` am Leben
    # und überwachen den Daemon-Prozess. Bei Daemon-Crash exitet auch der Container → Docker-Restart greift.
    command: >
      sh -c "
        mkdir -p /root/.claude-code-router &&
        if [ -f /host-claude/router-config.json ]; then
          cp /host-claude/router-config.json /root/.claude-code-router/config.json;
        else
          echo '{\"Providers\":[],\"Router\":{}}' > /root/.claude-code-router/config.json;
        fi &&
        ccr start &&
        sleep 1 &&
        DAEMON_PID=$$(pgrep -f 'node.*claude-code-router' | head -1) &&
        if [ -z \"$$DAEMON_PID\" ]; then echo 'ccr-daemon nicht gefunden'; exit 1; fi &&
        echo \"Router-Daemon PID: $$DAEMON_PID\" &&
        while kill -0 $$DAEMON_PID 2>/dev/null; do sleep 10; done &&
        echo 'Router-Daemon beendet'
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3456/health 2>/dev/null || pgrep -f 'node.*claude-code-router' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
