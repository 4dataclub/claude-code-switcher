services:
  claude-switcher:
    build: .
    ports:
      - "2000:2000"
    volumes:
      - ${HOME:-${USERPROFILE}}/.claude:/root/.claude
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CLAUDE_CONFIG_PATH=/root/.claude/settings.json
      - ROUTER_CONFIG_PATH=/root/.claude/router-config.json
      - ROUTER_CONTAINER=claude-switcher-router-1
      # Switcher → Router via interne Bridge: socat hört auf 3457, leitet zu ccr (127.0.0.1:3456)
      - ROUTER_BASE_URL=http://router:3457
      # llm-cascade Sidecar als geteilte Quelle fuer Modell-Liste + Cascade-Decisions.
      # Eigene DB pro Instanz (siehe llm_cascade_db unten) — keine state-Sharing mit anderen
      # Konsumenten wie EduPro. Konfig + Settings leben in unserer eigenen Postgres.
      - LLM_CASCADE_URL=http://llm-cascade:8090
    restart: unless-stopped
    depends_on:
      - router
      - llm-cascade

  llm-cascade:
    image: 4dataclub/llm-cascade:latest
    container_name: claude-switcher-llm-cascade-1
    ports:
      # 127.0.0.1-bound damit nur lokale Tools dran kommen, kein Public-Expose noetig.
      - "127.0.0.1:8091:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/switcher
      SPRING_DATASOURCE_USERNAME: switcher
      SPRING_DATASOURCE_PASSWORD: switcher
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: claude-switcher-db-1
    environment:
      POSTGRES_DB: switcher
      POSTGRES_USER: switcher
      POSTGRES_PASSWORD: switcher
    volumes:
      - switcher_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  router:
    build: ./router
    container_name: claude-switcher-router-1
    ports:
      # Host:3456 → Container:3457 (socat) → 127.0.0.1:3456 (ccr internal)
      - "3456:3457"
    volumes:
      - ${HOME:-${USERPROFILE}}/.claude:/host-claude:ro
    environment:
      - NON_INTERACTIVE_MODE=true
      - LOG_LEVEL=info
    restart: unless-stopped
    # 1. Config aus Host-Volume nach ccr-erwartetem Pfad kopieren
    # 2. ccr starten (daemon, hört auf interner 127.0.0.1:3456)
    # 3. socat als TCP-Bridge: 0.0.0.0:3457 → 127.0.0.1:3456 (foreground, hält Container am Leben)
    command: >
      sh -c "
        mkdir -p /root/.claude-code-router;
        [ -f /host-claude/router-config.json ] && cp /host-claude/router-config.json /root/.claude-code-router/config.json || echo '{\"Providers\":[],\"Router\":{}}' > /root/.claude-code-router/config.json;
        echo '>>> Cleanup alte PID-Datei (von vorherigem Container)';
        rm -f /root/.claude-code-router/.claude-code-router.pid;
        echo '>>> Starte socat im Hintergrund';
        socat TCP-LISTEN:3457,fork,reuseaddr TCP:127.0.0.1:3456 &
        echo '>>> Starte ccr (daemonisiert sich)';
        ccr start;
        echo '>>> Warte auf ccr-Listen auf 3456 (max 30s)';
        for i in $$(seq 1 30); do
          if nc -z 127.0.0.1 3456 2>/dev/null; then
            echo \">>> ccr ready nach $${i}s\"; break;
          fi;
          sleep 1;
        done;
        DAEMON_PID=$$(pgrep -f 'node.*claude-code-router' | head -1);
        if [ -z \"$$DAEMON_PID\" ]; then echo 'ERROR: ccr daemon nicht gefunden'; exit 1; fi;
        echo \">>> ccr-Daemon PID: $$DAEMON_PID — Container bleibt am Leben\";
        while kill -0 $$DAEMON_PID 2>/dev/null; do sleep 5; done;
        echo '>>> ccr beendet, Container exit'
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --timeout=3 http://127.0.0.1:3457/ >/dev/null 2>&1 || nc -z 127.0.0.1 3457"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  switcher_pgdata:
