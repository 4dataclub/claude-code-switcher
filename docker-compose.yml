services:
  claude-switcher:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ${HOME:-${USERPROFILE}}/.claude:/root/.claude
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CLAUDE_CONFIG_PATH=/root/.claude/settings.json
      - ROUTER_CONFIG_PATH=/root/.claude/router-config.json
      - ROUTER_CONTAINER=claude-switcher-router-1
      # Switcher → Router via interne Bridge: socat hört auf 3457, leitet zu ccr (127.0.0.1:3456)
      - ROUTER_BASE_URL=http://router:3457
    restart: unless-stopped
    depends_on:
      - router

  router:
    build: ./router
    container_name: claude-switcher-router-1
    ports:
      # Host:3456 → Container:3457 (socat) → 127.0.0.1:3456 (ccr internal)
      - "3456:3457"
    volumes:
      - ${HOME:-${USERPROFILE}}/.claude:/host-claude:ro
    environment:
      - NON_INTERACTIVE_MODE=true
      - LOG_LEVEL=info
    restart: unless-stopped
    # 1. Config aus Host-Volume nach ccr-erwartetem Pfad kopieren
    # 2. ccr starten (daemon, hört auf interner 127.0.0.1:3456)
    # 3. socat als TCP-Bridge: 0.0.0.0:3457 → 127.0.0.1:3456 (foreground, hält Container am Leben)
    command: >
      sh -c "
        mkdir -p /root/.claude-code-router;
        [ -f /host-claude/router-config.json ] && cp /host-claude/router-config.json /root/.claude-code-router/config.json || echo '{\"Providers\":[],\"Router\":{}}' > /root/.claude-code-router/config.json;
        echo '>>> Starte socat im Hintergrund (verbindet sobald ccr ready)';
        socat TCP-LISTEN:3457,fork,reuseaddr TCP:127.0.0.1:3456 &
        echo '>>> Starte ccr im Vordergrund (hält Container am Leben)';
        exec ccr start
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- --timeout=3 http://127.0.0.1:3457/ >/dev/null 2>&1 || nc -z 127.0.0.1 3457"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
